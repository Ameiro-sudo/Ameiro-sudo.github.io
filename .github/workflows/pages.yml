name: pages build and deployment

# 这个仓库的 git log 里 fix(a11y) / fix(motion) / fix(ui) 反复出现，每一轮都是
# 人肉点出来、人肉改完、人肉确认。修完没有闸门，所以必然回归——MC 状态项的
# aria-label 硬编码「离线」就是这么进来的。下面这个 job 就是那道闸门。

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # runner 镜像里的 Chrome 会自己往前跑（10-05 跑绿那次还是 152，十几天后的这两次
      # push 已经是 155），而 @axe-core/cli 自带的 chromedriver 钉在旧大版本上，于是
      # 它连浏览器都起不来：
      #   session not created: This version of ChromeDriver only supports Chrome version 152
      # 这两次 push 都不是页面问题，却全挂在这一步，Pages 也就跟着没动。装一个跟当前
      # Chrome 同大版本的 chromedriver 交给 axe。装到 $RUNNER_TEMP 而不是仓库里：
      # 本仓的 build 是 path: . 把整个仓库上传，装进来会被一起发布。
      - name: 装与 Chrome 同版的 ChromeDriver
        run: |
          MAJOR=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
          npm i --prefix "$RUNNER_TEMP/driver" --no-save --no-package-lock "chromedriver@$MAJOR" \
            || npm i --prefix "$RUNNER_TEMP/driver" --no-save --no-package-lock chromedriver@latest
          DRIVER=$(node -e "process.stdout.write(require('$RUNNER_TEMP/driver/node_modules/chromedriver').path)")
          test -x "$DRIVER"
          google-chrome --version
          "$DRIVER" --version
          echo "CHROMEDRIVER_PATH=$DRIVER" >> "$GITHUB_ENV"

      # axe 必须对着一个真的 HTTP origin 扫，本地文件路径模式下它会去请求
      # 自己的服务器并拿回一张错误页，于是报出来的违规全是那张页面的
      # （实测：扫 index.html 报「没有 main landmark」+「#main-content 不在
      # landmark 里」，而本文件的 <main> 明明就在那儿）。所以先起个静态服务。
      - name: 起本地服务
        run: |
          python3 -m http.server 8081 --bind 127.0.0.1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8081/index.html -o /dev/null; then echo ready; exit 0; fi
            sleep 0.5
          done
          echo "服务未在 20s 内就绪" >&2
          exit 1

      # --load-delay 1500：默认是 0，load 事件一触发就扫。这个站首屏要下两张背景图
      # （bg.webp 145KB、bg-portrait.webp 149KB）与三套字体，扫得太早等于量一个
      # 还没成型的页面。在 blog 与 win11-replica 上都踩过：CI 报的违规数与本地
      # 对不上，改动到位之后条数却纹丝不动 —— 那是量错了对象，不是页面有问题。
      #
      # --save axe-report + 下面上传 artifact：文本报告只给「哪条规则、哪些选择器」，
      # 不给前景色/背景色/实际比值。红的时候靠猜太费时间。
      - name: axe 扫描（0 违规才继续）
        run: |
          npx --yes @axe-core/cli@latest --exit --load-delay 1500 --save axe-report \
            --chromedriver-path "$CHROMEDRIVER_PATH" \
            http://127.0.0.1:8081/index.html \
            http://127.0.0.1:8081/404.html

      - name: 上传 axe 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: axe-report
          if-no-files-found: ignore
      # ---------------------------------------------------------------
      # 设计令牌漂移检查
      #
      # 三个静态站的 assets/css/tokens.css 是同一套设计令牌的三份副本。
      # 实测过：三站里只有这一份是共享资产——style.css 三份全不同、toast.css
      # 只有两站有、shell.css 只有 blog 有，它们是各站自己的样式表。
      #
      # 比的是每一处自定义属性的取值（按出现顺序），不是文件字节：注释各站自己写。
      # 只比每个属性的「最后一个值」是不够的——深色主题在文件后面，最后一个值永远
      # 是深色的，浅色那处漂移就查不出来（第一版就是这么写的，注入一处浅色改动
      # 试过，没报）。
      #
      # 期望的摩擦：改了一处而另外两站没跟上时，这几仓的构建会一起红。这正是它的
      # 作用——把「改一处要记得同步另外两处」从口头约定变成会红的检查。
      # 两边都像是故意的，就挑一个当成本次改动的意图，把另一个对齐它。
      - name: 设计令牌漂移检查
        run: |
          node scripts/check-tokens-drift.mjs \
            'B=https://raw.githubusercontent.com/Ameiro-sudo/inecraft-Server-Status-test/main/assets/css/tokens.css' \
            'blog=https://raw.githubusercontent.com/Ameiro-sudo/blog/main/assets/css/tokens.css'
      # ---------------------------------------------------------------
      # 页面不变量检查
      #
      # 这三条约束以前写在本站两个页面的 HTML 注释里，而散文拦不住回归：那段讲
      # frame-ancestors 的说明少写了一个 `<!--`，整段说明变成正文，把 <title> 和
      # 20 个 <meta> 从 head 挤进了 body —— 线上 15125 字节的响应里含着它，每个
      # 访客都会先看到一段无样式的黑字。防错措施自己成了最大的那次错误。
      # 现在注释只留一行禁令，判据搬到这里：
      #   1. head 里不许有注释外的裸文本，注释必须闭合；
      #   2. 内联 <style> 里不许出现 @media (prefers-color-scheme: dark)；
      #   3. toast.css 的 <link> 必须排在 style.css 之后。
      # 三条都属于「改错了不会报错」的那类，所以只能由 CI 报。改注释没用。
      - name: 页面不变量检查
        run: node scripts/check-page-invariants.mjs

  build:
    runs-on: ubuntu-latest
    needs: a11y
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # 白名单，而不是 `.`。原来发布整个仓库，于是 scripts/ 与 THIRD-PARTY.md 也在
      # 公网可读（实测 /scripts/check-page-invariants.mjs 返回 200，而页面上没有任何
      # 地方引用它）。站内引用过的只有 assets/、根目录的 *.html、以及 sw.js
      # （app.js:345 注册的那个）——少一个就是白屏或图标全丢。
      # 先落到一个目录再上传：upload-pages-artifact 的多行 path 会被当成一个文件名
      # 传给 tar。
      - name: 收集要发布的文件
        run: |
          mkdir -p _site
          cp CNAME robots.txt sitemap.xml favicon.ico sw.js _site/
          cp ./*.html _site/
          cp -r ./assets _site/assets
          echo "将发布："; find _site -maxdepth 1 | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4